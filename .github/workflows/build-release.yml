name: Build & Release DMG

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # komplette History + Tags fuer die Versionshinweise

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Tools
        run: |
          brew install xcodegen
          sudo gem install cocoapods

      - name: Generate Project
        run: xcodegen generate

      - name: Install Pods
        run: pod install

      - name: Build App
        run: |
          # Version aus dem Tag ableiten (v1.0.1 -> 1.0.1)
          VERSION="${GITHUB_REF_NAME#v}"

          xcodebuild -workspace "IPTV Player.xcworkspace" \
            -scheme IPTV \
            -configuration Release \
            -derivedDataPath build \
            -arch arm64 -arch x86_64 \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Version
        run: |
          PLIST="build/Build/Products/Release/IPTV Player.app/Contents/Info.plist"
          echo "Version: $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$PLIST")"
          echo "Build:   $(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$PLIST")"

      - name: Ad-hoc Sign App
        run: |
          # Gueltige (ad-hoc) Signatur, damit Sparkle das Update verifizieren kann
          APP_PATH="build/Build/Products/Release/IPTV Player.app"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Create DMG
        run: |
          APP_PATH="build/Build/Products/Release/IPTV Player.app"
          DMG_NAME="IPTV-Player-${GITHUB_REF_NAME}.dmg"

          # Temp-Ordner fuer DMG-Inhalt
          mkdir -p dmg_content
          cp -R "$APP_PATH" dmg_content/
          ln -s /Applications dmg_content/Applications

          # DMG erstellen
          hdiutil create -volname "IPTV Player" \
            -srcfolder dmg_content \
            -ov -format UDZO \
            "$DMG_NAME"

          echo "DMG_NAME=$DMG_NAME" >> $GITHUB_ENV

      - name: Create Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"

          # Versionshinweise: Commits seit dem vorherigen Tag
          PREV_TAG="$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          git log --no-merges --pretty=format:'%s' "${PREV_TAG:+$PREV_TAG..}${GITHUB_REF_NAME}" > notes.txt

          scripts/make-appcast.sh \
            "$DMG_NAME" \
            "$VERSION" \
            "${{ github.run_number }}" \
            "$REPO_URL/releases/download/${GITHUB_REF_NAME}/${DMG_NAME}" \
            "$REPO_URL/releases/tag/${GITHUB_REF_NAME}" \
            notes.txt > appcast.xml

          cat appcast.xml

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "IPTV Player ${{ github.ref_name }}"
          body: |
            ## IPTV Player ${{ github.ref_name }}

            ### Installation
            1. DMG herunterladen und oeffnen
            2. App in den Applications-Ordner ziehen
            3. **Wichtig:** Terminal oeffnen und ausfuehren:
            ```
            xattr -cr "/Applications/IPTV Player.app"
            ```
            4. App starten

            > Der Terminal-Befehl ist noetig, weil die App nicht mit einem Apple-Zertifikat signiert ist. macOS blockiert unsignierte Downloads standardmaessig.

            ### Updates
            Ab Version 1.0.3 aktualisiert sich die App selbst (Menue "IPTV Player" → "Nach Updates suchen…"). Der Terminal-Befehl ist nur bei der Erstinstallation noetig.

            ### Voraussetzungen
            - macOS 14.0 (Sonoma) oder neuer
          files: |
            ${{ env.DMG_NAME }}
            appcast.xml
          draft: false
